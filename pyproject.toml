[project]
name = "blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ksenia", email = "kseniatravnikova@duck.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aerich[toml]>=0.9.2",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "jamlib>=2.2.5",
    "litestar>=2.17.0",
    "opensearch-py[async]>=2.8.0",
    "punq>=0.7.0",
    "redis>=7.1.0",
    "tortoise-orm>=0.25.1",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "icecream>=2.1.8",
    "mypy>=1.18.2",
    "ruff>=0.13.2",
]
tests = [
    "pytest-asyncio>=1.3.0",
]

[tool.aerich]
tortoise_orm = "src.infra.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
target-version = "py313"
line-length = 80
exclude = ["*__init__.py"]

[tool.ruff.lint.isort]
case-sensitive = true
constants = ["__future__"]
detect-same-package = true
known-first-party = ["src"]
lines-after-imports = 2
lines-between-types = 1
order-by-type = true

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
