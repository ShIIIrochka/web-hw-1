global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'blog-local'
    environment: 'development'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Blog API metrics
  - job_name: 'blog-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'blog-api'
          env: 'local'
