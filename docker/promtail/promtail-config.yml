server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: blog-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: blog-app
          app: blog
          env: local
          __path__: /var/log/blog/*.log

    pipeline_stages:
      # Парсим JSON логи
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            path: path
            method: method
            status_code: status_code
            duration_ms: duration_ms
            user_id: user_id
            exception: exception

      # Используем timestamp из лога
      - timestamp:
          source: timestamp
          format: RFC3339

      # Добавляем labels
      - labels:
          level:
          request_id:

      # Выводим финальное сообщение
      - output:
          source: message
