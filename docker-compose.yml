services:
  backend:
    container_name: backend
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_URI=asyncpg://admin:password@postgres/db
      - SECRET_KEY=test
      - OPENSEARCH_URI=http://admin:pbWlZ&ys9cXY@opensearch:9200/posts
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      - postgres
      - opensearch

  postgres:
    container_name: postgres
    image: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    ports:
      - "5432:5432"

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:3.3.2
    environment:
      - OPENSEARCH_USERNAME=admin
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=pbWlZ&ys9cXY"
      - discovery.type=single-node
    ports:
      - "9200:9200"
      - "9600:9600"

  redis:
      container_name: redis
      image: redis
      ports:
          - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/~/Projects/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"